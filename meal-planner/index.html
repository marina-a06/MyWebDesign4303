<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meal Planner</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <h1>Mom Life Command Center</h1>
</header>

<nav>
  <a href="../index.html">Home</a>
  <a href="../calendar/index.html">Calendar</a>
  <a href="../to-do-list/index.html">To-Do</a>
  <a href="../meal-planner/index.html">Meals</a>
</nav>



<div class="container">
 <div class="container">

  <div class="meal-layout">

    <!-- MEAL PLANNER -->
    <div class="meal-section">
      <h2>Weekly Meal Planner</h2>

      <div class="day">
        <label>Monday:</label>
        <input type="text" id="monday">
      </div>

      <div class="day">
        <label>Tuesday:</label>
        <input type="text" id="tuesday">
      </div>

      <div class="day">
        <label>Wednesday:</label>
        <input type="text" id="wednesday">
      </div>

      <div class="day">
        <label>Thursday:</label>
        <input type="text" id="thursday">
      </div>

      <div class="day">
        <label>Friday:</label>
        <input type="text" id="friday">
      </div>

      <div class="day">
        <label>Saturday:</label>
        <input type="text" id="saturday">
      </div>

      <div class="day">
        <label>Sunday:</label>
        <input type="text" id="sunday">
      </div>
    </div>

    <!-- GROCERY LIST -->
    <div class="grocery-section">
      <h2>Grocery List</h2>

      <div class="grocery-input">
        <input type="text" id="groceryItem" placeholder="Add grocery item">
        <button id="addItemBtn">Add</button>
      </div>

      <ul id="groceryList"></ul>
    </div>

  </div>

</div>


<script>
const days = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];

function loadMeals() {
  let savedMeals = JSON.parse(localStorage.getItem("meals")) || {};

  days.forEach(day => {
    if (savedMeals[day]) {
      document.getElementById(day).value = savedMeals[day];
    }
  });
}

function saveMeals() {
  let meals = {};

  days.forEach(day => {
    meals[day] = document.getElementById(day).value;
  });

  localStorage.setItem("meals", JSON.stringify(meals));
}

days.forEach(day => {
  document.getElementById(day).addEventListener("input", saveMeals);
});

loadMeals();

const groceryInput = document.getElementById("groceryItem");
const addItemBtn = document.getElementById("addItemBtn");
const groceryList = document.getElementById("groceryList");

let groceries = JSON.parse(localStorage.getItem("groceries")) || [];

function saveGroceries() {
  localStorage.setItem("groceries", JSON.stringify(groceries));
}

function renderGroceries() {
  groceryList.innerHTML = "";

  groceries.forEach((item, index) => {
    const li = document.createElement("li");

    li.innerHTML = `
      <span>${item}</span>
      <button onclick="removeItem(${index})">X</button>
    `;

    groceryList.appendChild(li);
  });
}

function addItem() {
  const itemText = groceryInput.value.trim();

  if (itemText === "") return;

  groceries.push(itemText);

  saveGroceries();
  renderGroceries();

  groceryInput.value = "";
}

function removeItem(index) {
  groceries.splice(index, 1);

  saveGroceries();
  renderGroceries();
}

addItemBtn.addEventListener("click", addItem);

groceryInput.addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    addItem();
  }
});

renderGroceries();
</script>

</body>
</html>
