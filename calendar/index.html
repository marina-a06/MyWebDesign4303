<!DOCTYPE html>
<html lang="en">
<head>
    
  <meta charset="UTF-8">
  <title>Calendar</title>

<link rel="stylesheet" href="../style.css">

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<header>
  <h1>Mom Life Command Center</h1>
</header>

<nav>
  <a href="../index.html">Home</a>
  <a href="../calendar/index.html">Calendar</a>
  <a href="../to-do-list/index.html">To-Do</a>
  <a href="../meal-planner/index.html">Meals</a>
</nav>
<div class="container">
  <div class="app">

  
    <div class="sidebar">
      <button id="clearEvents">Clear Events</button>
      <h3 id="selectedDate">Selected Date: None</h3>

      <section class="activity-tracker kid">
        <h2>⭐ Joseph Tracker</h2>
        <div class="tracker-input">
          <input type="text" id="kidInput" placeholder="Kid activity">
          <button onclick="addActivity('kid')">Add</button>
        </div>
        <ul id="kidList"></ul>
      </section>

      <section class="activity-tracker mom">
        <h2>💙 Mom Tracker</h2>
        <div class="tracker-input">
          <input type="text" id="momInput" placeholder="Mom task">
          <button onclick="addActivity('mom')">Add</button>
        </div>
        <ul id="momList"></ul>
      </section>

      <section class="activity-tracker dad">
        <h2>💜 Dad Tracker</h2>
        <div class="tracker-input">
          <input type="text" id="dadInput" placeholder="Dad task">
          <button onclick="addActivity('dad')">Add</button>
        </div>
        <ul id="dadList"></ul>
      </section>
    </div>

  
    <div class="main">
      <div class="header">
        <h2>Family Calendar</h2>
      </div>

      <div id="calendar"></div>
    </div>

  </div>
</div>

  
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  
<script>
document.addEventListener('DOMContentLoaded', function () {

  
  const calendarEl = document.getElementById('calendar');

  let selectedDate = null;
  let activitiesByDate = JSON.parse(localStorage.getItem("activitiesByDate")) || {};
  const savedEvents = JSON.parse(localStorage.getItem('events')) || [];

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    editable: true,
    selectable: true,

  
    events: [
      ...savedEvents,
      ...convertActivitiesToEvents(activitiesByDate)
    ],

   
    dateClick: function(info) {
      selectedDate = info.dateStr;

      document.getElementById("selectedDate").innerText =
        "Selected Date: " + selectedDate;

      renderActivities();
    },

    eventClick: function(info) {
      const newTitle = prompt("Edit event name:", info.event.title);

      if (newTitle === "") {
        info.event.remove();
      } else if (newTitle) {
        info.event.setProp('title', newTitle);
      }

      saveEvents();
    },

    eventChange: function() {
      saveEvents();
    }
  });

  calendar.render();

    const clearBtn = document.getElementById('clearEvents');

clearBtn.addEventListener('click', function () {
  if (confirm("Delete ALL events and activities?")) {

    localStorage.removeItem('events');
    localStorage.removeItem('activitiesByDate');
  
    calendar.removeAllEvents();

    activitiesByDate = {};
    selectedDate = null;

    document.getElementById("selectedDate").innerText = "Selected Date: None";

    ["kidList", "momList", "dadList"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = "";
    });
  }
}); 

  function convertActivitiesToEvents(data) {
    const events = [];

    Object.keys(data).forEach(date => {
      data[date].forEach(activity => {
        events.push({
          title: getIcon(activity.type) + " " + activity.text,
          start: date,
          allDay: true,
          backgroundColor: {
            kid: "#4CAF50",
            mom: "#2196F3",
            dad: "#9C27B0"
          }[activity.type],
        });
      });
    });

    return events;
  }

 
  function saveEvents() {
    const events = calendar.getEvents()
      .filter(e => !e.title.startsWith("⭐"))
      .map(event => ({
        title: event.title,
        start: event.start,
        end: event.end,
        allDay: event.allDay
      }));

    localStorage.setItem('events', JSON.stringify(events));
  }

  
 window.addActivity = function(type) {
  if (!selectedDate) {
    alert("Please select a date first!");
    return;
  }

  const inputMap = {
    kid: "kidInput",
    mom: "momInput",
    dad: "dadInput"
  };

  const input = document.getElementById(inputMap[type]);
  const text = input.value.trim();

  if (!text) return;

  if (!activitiesByDate[selectedDate]) {
    activitiesByDate[selectedDate] = [];
  }

  const activity = {
    text: text,
    done: false,
    type: type
  };

  activitiesByDate[selectedDate].push(activity);

  localStorage.setItem("activitiesByDate", JSON.stringify(activitiesByDate));


  const colorMap = {
    kid: "#4CAF50",
    mom: "#2196F3",
    dad: "#9C27B0"
  };

  calendar.addEvent({
    title: getIcon(type) + " " + text,
    start: selectedDate,
    allDay: true,
    backgroundColor: colorMap[type]
  });

  input.value = "";
  renderActivities();
  };

  
  function renderActivities() {
  const lists = {
    kid: document.getElementById("kidList"),
    mom: document.getElementById("momList"),
    dad: document.getElementById("dadList")
  };

  Object.values(lists).forEach(list => list.innerHTML = "");

  if (!selectedDate || !activitiesByDate[selectedDate]) return;

  activitiesByDate[selectedDate].forEach((activity, index) => {
    const li = document.createElement("li");

    li.innerHTML = `
      <label>
        <input type="checkbox" ${activity.done ? "checked" : ""}
          onchange="toggleActivity(${index})">
        ${activity.text}
      </label>
      <button onclick="deleteActivity(${index})">❌</button>
    `;

    lists[activity.type].appendChild(li);
  });
  }

 
  window.toggleActivity = function(index) {
    activitiesByDate[selectedDate][index].done =
      !activitiesByDate[selectedDate][index].done;

    localStorage.setItem("activitiesByDate", JSON.stringify(activitiesByDate));
  };

  
  window.deleteActivity = function(index) {
    const removed = activitiesByDate[selectedDate].splice(index, 1)[0];

    localStorage.setItem("activitiesByDate", JSON.stringify(activitiesByDate));

   
    calendar.getEvents().forEach(event => {
      if (
        event.title === "⭐ " + removed.text &&
        event.startStr === selectedDate
      ) {
        event.remove();
      }
    });

    renderActivities();
  };

});

function getIcon(type) {
  return {
    kid: "⭐",
    mom: "💙",
    dad: "💜"
  }[type];
}

</script>


</body>
</html>
